{% extends 'management/base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Dashboard</h2>
    <p class="muted">Welcome back, {{ user.username }}.</p>
</div>

<div class="card-grid">
    <a href="{% url 'studentlist' %}" class="dash-card">
        <h3>View Students</h3>
        <p>Browse, edit, and remove student records.</p>
    </a>
    <a href="{% url 'create' %}" class="dash-card">
        <h3>Add Student</h3>
        <p>Create a new student record.</p>
    </a>
</div>
{% endblock %}
